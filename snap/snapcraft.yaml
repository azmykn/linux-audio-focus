name: linux-audio-focus
base: core22
version: '1.0.1'
summary: Mobile-like audio focus manager for Linux desktops (MPRIS)
description: |
  Automatically pauses competing media players (YouTube in browsers,
  Spotify, VLC, local video players) when an incoming audio/voice stream
  plays (e.g. WhatsApp Web voice note in Chrome), and automatically resumes
  interrupted playback when the voice note finishes.

grade: stable
confinement: strict

apps:
  linux-audio-focus:
    command: bin/linux-audio-focus
    autostart: linux-audio-focus.desktop
    environment:
      GI_TYPELIB_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/girepository-1.0:$SNAP/usr/lib/girepository-1.0
      PYTHONPATH: $SNAP/lib/python3.10/site-packages:$SNAP/usr/lib/python3/dist-packages:$SNAP/usr/local/lib/python3.10/dist-packages
    plugs:
      - mpris
      - desktop

parts:
  linux-audio-focus:
    plugin: dump
    source: .
    organize:
      bin/linux-audio-focus.py: bin/linux-audio-focus
    stage-packages:
      - python3
      - python3-gi
      - gir1.2-glib-2.0
      - libglib2.0-0
