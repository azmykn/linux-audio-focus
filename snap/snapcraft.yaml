name: linux-audio-focus
base: core22
version: '1.0.1'
summary: Mobile-style Audio Focus manager for Linux (Auto-pause/resume)
description: |
  Linux Audio Focus brings intelligent, mobile-grade Audio Focus management to your Linux desktop.

  On mobile phones, when a voice note or incoming call plays, background YouTube videos or music automatically pause and resume when finished. On Linux desktops, multiple audio streams clash and play on top of each other by default.

  Linux Audio Focus fixes this by running as a lightweight background service that listens to media player events over D-Bus (MPRIS):
  - When an incoming audio or voice note plays (e.g. WhatsApp Web in Chrome), it automatically pauses competing players (e.g. YouTube in Firefox, VLC, or Spotify).
  - When the voice note ends, your background media resumes automatically from the exact moment it stopped.
  - Zero CPU polling (event-driven D-Bus signals) with minimal memory footprint (~14MB).
  - Works with all popular web browsers (Chrome, Firefox, Brave, Edge) and media players (VLC, MPV, Celluloid, Spotify).

grade: stable
confinement: strict

apps:
  linux-audio-focus:
    command: bin/linux-audio-focus
    autostart: linux-audio-focus.desktop
    environment:
      GI_TYPELIB_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/girepository-1.0:$SNAP/usr/lib/girepository-1.0
      PYTHONPATH: $SNAP/lib/python3.10/site-packages:$SNAP/usr/lib/python3/dist-packages:$SNAP/usr/local/lib/python3.10/dist-packages
    plugs:
      - mpris
      - desktop

parts:
  linux-audio-focus:
    plugin: dump
    source: .
    organize:
      bin/linux-audio-focus.py: bin/linux-audio-focus
    stage-packages:
      - python3
      - python3-gi
      - gir1.2-glib-2.0
      - libglib2.0-0
