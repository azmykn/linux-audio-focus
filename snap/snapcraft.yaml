name: linux-audio-focus
base: core22
version: '1.0.1'
summary: Auto-pause background media when other audio plays, like on phones
description: |
  Ever listened to a YouTube video, podcast, or music on your PC, clicked to play a WhatsApp voice note—and had both blast through your speakers at the same time?

  On smartphones, background audio pauses automatically. On Linux desktops, all audio streams clash together by default. Linux Audio Focus fixes this problem once and for all.

  It runs quietly in the background and brings smart mobile-grade Audio Focus to your desktop:
  - Play an audio message or voice note (WhatsApp Web, Telegram, Slack, etc.).
  - Your background media (YouTube in browsers, Spotify, VLC, MPV) pauses instantly.
  - When the voice note finishes, your media resumes automatically from the exact second it stopped.

  Highlights:
  - Zero Configuration: Works out of the box right after installation.
  - Universal MPRIS Support: Seamlessly controls Chrome, Firefox, Brave, Edge, VLC, MPV, Celluloid, Spotify, and more.
  - True Event-Driven: Consumes 0.0% CPU at idle (pure D-Bus event listening) and uses negligible memory (~14MB).
  - Reliable State Management: Tracks interrupting streams accurately so your audio never stutters or gets stuck.

grade: stable
confinement: strict

apps:
  linux-audio-focus:
    command: bin/linux-audio-focus
    autostart: linux-audio-focus.desktop
    environment:
      GI_TYPELIB_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/girepository-1.0:$SNAP/usr/lib/girepository-1.0
      PYTHONPATH: $SNAP/lib/python3.10/site-packages:$SNAP/usr/lib/python3/dist-packages:$SNAP/usr/local/lib/python3.10/dist-packages
    plugs:
      - mpris
      - desktop

parts:
  linux-audio-focus:
    plugin: dump
    source: .
    organize:
      bin/linux-audio-focus.py: bin/linux-audio-focus
    stage-packages:
      - python3
      - python3-gi
      - gir1.2-glib-2.0
      - libglib2.0-0
